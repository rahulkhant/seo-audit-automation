# Weekly SEO Audit
#
# Purpose
# -------
# Runs the complete audit (main.py) automatically once a week, in the
# cloud, with no one needing to be at their computer, for every registered
# project (see projects.py) -- one after another in this same job, not a
# parallel matrix, specifically so each project's commit+push happens
# before the next project starts (a matrix would have multiple jobs
# checking out the same starting commit and racing to push, which risks
# one project's run silently overwriting another's). Committing after each
# project (not once at the very end) means a failure on project 5 doesn't
# lose 1-4's already-completed work.
#
# Also supports a manual "Run workflow" button (workflow_dispatch) with an
# optional project input, so a single project can be re-run on demand
# without waiting for the schedule or running all of them.

name: Weekly SEO Audit

on:
  schedule:
    # Every Monday at 06:00 UTC. Cron format: minute hour day month weekday.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      project:
        description: "Project slug to run (see projects.py), or leave as 'all' to run every registered project."
        required: false
        default: "all"

# Needed so this workflow's automatic commits (one per project, see below)
# are allowed to push back to the repository.
permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's browser
        run: python -m playwright install --with-deps chromium

      - name: Run the SEO audit for every selected project
        env:
          SMTP_EMAIL_ADDRESS: ${{ secrets.SMTP_EMAIL_ADDRESS }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NOTIFICATION_RECIPIENT: ${{ secrets.NOTIFICATION_RECIPIENT }}
          PROJECT_INPUT: ${{ github.event.inputs.project || 'all' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$PROJECT_INPUT" = "all" ]; then
            PROJECTS=$(python -c "from projects import list_projects; print(' '.join(slug for slug, _ in list_projects()))")
          else
            PROJECTS="$PROJECT_INPUT"
          fi

          for project in $PROJECTS; do
            echo "=== Running audit for project: $project ==="
            python main.py "$project"

            git add data/ docs/
            git diff --cached --quiet || git commit -m "Automated SEO audit run: $project [skip ci]"
            git push
          done
