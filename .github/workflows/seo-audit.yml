# Weekly SEO Audit
#
# Purpose
# -------
# Runs the complete audit (main.py) automatically once a week, in the
# cloud, with no one needing to be at their computer. It also supports a
# manual "Run workflow" button (workflow_dispatch) so we can test it
# on-demand without waiting for the schedule.
#
# Because each run starts from a fresh checkout of the repository, the
# database and dashboard changes main.py produces only "count" once we
# commit them back -- that's what the final step does.

name: Weekly SEO Audit

on:
  schedule:
    # Every Monday at 06:00 UTC. Cron format: minute hour day month weekday.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

# Needed so this workflow's automatic commit (the last step below) is
# allowed to push back to the repository.
permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's browser
        run: python -m playwright install --with-deps chromium

      - name: Run the SEO audit
        env:
          SMTP_EMAIL_ADDRESS: ${{ secrets.SMTP_EMAIL_ADDRESS }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NOTIFICATION_RECIPIENT: ${{ secrets.NOTIFICATION_RECIPIENT }}
        run: python main.py

      - name: Commit updated database and dashboard back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seo_audit_history.db docs/
          git diff --cached --quiet || git commit -m "Automated SEO audit run [skip ci]"
          git push
