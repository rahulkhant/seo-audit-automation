<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Outlines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  :root {
    color-scheme: light;
    --mx-body-bg: #f5f8fa;
    --mx-card-bg: #ffffff;
    --mx-border: #eff2f5;
    --mx-text-dark: #181c32;
    --mx-text-gray-700: #3f4254;
    --mx-text-gray-600: #7e8299;
    --mx-text-gray-500: #a1a5b7;
    --mx-primary: #009ef7;
    --mx-primary-light: rgba(0,158,247,0.1);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --mx-body-bg: #15151f;
      --mx-card-bg: #1c1c28;
      --mx-border: #2b2b3a;
      --mx-text-dark: #ffffff;
      --mx-text-gray-700: #cdcddb;
      --mx-text-gray-600: #9899ac;
      --mx-text-gray-500: #6d6d80;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --mx-body-bg: #15151f;
    --mx-card-bg: #1c1c28;
    --mx-border: #2b2b3a;
    --mx-text-dark: #ffffff;
    --mx-text-gray-700: #cdcddb;
    --mx-text-gray-600: #9899ac;
    --mx-text-gray-500: #6d6d80;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--mx-body-bg);
    color: var(--mx-text-dark);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; }

  .app { display: flex; min-height: 100vh; align-items: stretch; }

  .sidebar {
    width: 264px; flex-shrink: 0; background: #1e1e2d; color: #92929f;
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
  }
  .sidebar-brand {
    padding: 22px 24px; font-size: 1.05rem; font-weight: 700; color: #ffffff;
    display: flex; align-items: center; gap: 10px;
  }
  .brand-logo { height: 34px; width: auto; display: block; }
  .brand-logo-text { font-size: 1.1rem; font-weight: 700; color: #ffffff; }
  .sidebar-nav { padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .sidebar-link {
    display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 8px;
    text-decoration: none; color: #92929f; font-size: 0.92rem; font-weight: 500;
  }
  .sidebar-link svg { width: 18px; height: 18px; flex-shrink: 0; }
  .sidebar-link:hover { color: #ffffff; background: rgba(255,255,255,0.06); }
  .sidebar-link.active { color: #ffffff; background: rgba(255,255,255,0.06); box-shadow: inset 3px 0 0 var(--mx-primary); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: 20px 32px; background: var(--mx-card-bg); border-bottom: 1px solid var(--mx-border);
  }
  .topbar-title { font-size: 1.25rem; font-weight: 700; }
  .topbar-sub { color: var(--mx-text-gray-600); font-size: 0.87rem; margin-top: 3px; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.87rem;
    padding: 10px 18px; border-radius: 8px; text-decoration: none; border: none; cursor: pointer;
    font-family: inherit; white-space: nowrap;
  }
  .btn svg { width: 16px; height: 16px; }
  .btn-primary { background: var(--mx-primary); color: #ffffff; }
  .btn-primary:hover { background: #008fdd; }
  .btn-light { background: var(--mx-primary-light); color: var(--mx-primary); }
  .btn-light:hover { background: rgba(0,158,247,0.18); }
  .btn:disabled { opacity: 0.4; cursor: default; }

  .content { padding: 28px 32px 48px; max-width: 1360px; width: 100%; margin: 0 auto; }

  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px; }
  .kpi-card {
    background: var(--mx-card-bg); border: 1px solid var(--mx-border); border-radius: 12px;
    padding: 20px; display: flex; align-items: center; gap: 16px;
  }
  .kpi-icon {
    width: 48px; height: 48px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; color: var(--kpi-color); background-color: color-mix(in srgb, var(--kpi-color) 15%, transparent);
  }
  .kpi-icon svg { width: 22px; height: 22px; }
  .kpi-value { font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
  .kpi-label { color: var(--mx-text-gray-600); font-size: 0.85rem; margin-top: 3px; }

  .row-2col { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; margin-bottom: 20px; align-items: stretch; }

  .card { background: var(--mx-card-bg); border: 1px solid var(--mx-border); border-radius: 12px; margin-bottom: 20px; }
  .card:last-child { margin-bottom: 0; }
  .row-2col > .card { margin-bottom: 0; }
  .card-header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 18px 22px; border-bottom: 1px solid var(--mx-border);
  }
  .card-header-title { font-size: 1.02rem; font-weight: 700; }
  .card-body { padding: 20px 22px; }

  .chart-pages-audited { text-align: center; color: var(--mx-text-gray-600); font-size: 0.85rem; margin-top: 8px; }
  .chart-empty, .trend-empty { color: var(--mx-text-gray-600); font-size: 0.9rem; padding: 24px 0; text-align: center; }

  .trend-list { display: flex; flex-direction: column; gap: 16px; padding: 22px; }
  .trend-list-item { display: flex; align-items: center; gap: 12px; }
  .trend-icon {
    width: 38px; height: 38px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; color: var(--kpi-color); background-color: color-mix(in srgb, var(--kpi-color) 15%, transparent);
  }
  .trend-icon svg { width: 18px; height: 18px; }
  .trend-value { font-weight: 700; font-size: 1.05rem; }
  .trend-desc { color: var(--mx-text-gray-600); font-size: 0.85rem; }

  .card-header-controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  #category-select, #search-input {
    font-family: inherit; font-size: 0.87rem; padding: 9px 14px; border-radius: 8px;
    border: 1px solid var(--mx-border); background: var(--mx-body-bg); color: var(--mx-text-dark);
  }
  #category-select { min-width: 230px; }
  #search-input { min-width: 260px; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; table-layout: fixed; border-collapse: collapse; }
  thead th {
    text-align: left; padding: 12px 22px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--mx-text-gray-500); font-weight: 600; border-bottom: 1px solid var(--mx-border); white-space: nowrap;
  }
  tbody td {
    padding: 14px 22px; font-size: 0.87rem; vertical-align: top; border-bottom: 1px solid var(--mx-border);
    word-wrap: break-word; overflow-wrap: break-word;
  }
  tbody tr:hover { background: var(--mx-body-bg); }
  td.muted { color: var(--mx-text-gray-600); }

  .severity-badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px;
    font-weight: 600; font-size: 0.78rem; color: var(--badge-color); white-space: nowrap;
    background-color: color-mix(in srgb, var(--badge-color) 14%, transparent);
  }

  .pagination-bar { display: flex; align-items: center; gap: 12px; padding: 18px 22px; }
  #page-indicator { color: var(--mx-text-gray-600); font-size: 0.85rem; }

  col.col-severity { width: 12%; }
  col.col-page { width: 22%; }
  col.col-issue { width: 27%; }
  col.col-expected { width: 19%; }
  col.col-actual { width: 20%; }
  col.col-run { width: 12%; }
  col.col-date { width: 24%; }
  col.col-pages { width: 14%; }
  col.col-hist-severity { width: 30%; }
  col.col-download { width: 20%; }

  @media (max-width: 960px) {
    .row-2col { grid-template-columns: 1fr; }
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 720px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: static; flex-direction: row; align-items: center; }
    .sidebar-nav { flex-direction: row; }
    .kpi-row { grid-template-columns: 1fr; }
    .content { padding: 20px; }
  }

</style>

<style>
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--mx-border); }
  .tab-button {
    padding: 10px 18px; border: none; background: transparent; font-family: inherit; font-size: 0.9rem;
    font-weight: 600; color: var(--mx-text-gray-600); cursor: pointer; border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab-button:hover { color: var(--mx-text-dark); }
  .tab-button.active { color: var(--mx-primary); border-bottom-color: var(--mx-primary); }
  .tab-panel[hidden] { display: none; }

  .brief-list { display: flex; flex-direction: column; gap: 10px; }
  .brief-row {
    background: var(--mx-card-bg); border: 1px solid var(--mx-border); border-radius: 10px;
    padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
    gap: 16px; cursor: pointer;
  }
  .brief-row:hover { border-color: var(--mx-primary); }
  .pending-row {
    background: var(--mx-card-bg); border: 1px dashed var(--mx-border); border-radius: 10px;
    padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
    gap: 16px; color: var(--mx-text-gray-500);
  }
  .brief-row-main, .pending-row-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .brief-topic { font-weight: 700; font-size: 0.98rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brief-meta, .pending-meta { color: var(--mx-text-gray-600); font-size: 0.83rem; }
  .brief-row-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .status-badge {
    display: inline-flex; align-items: center; padding: 5px 12px; border-radius: 999px;
    font-weight: 600; font-size: 0.78rem; color: var(--mx-primary);
    background-color: var(--mx-primary-light); white-space: nowrap;
  }
  .score-badge {
    display: inline-flex; align-items: center; padding: 5px 12px; border-radius: 999px;
    font-weight: 700; font-size: 0.85rem; color: var(--score-color);
    background-color: color-mix(in srgb, var(--score-color) 15%, transparent); white-space: nowrap;
  }
  .empty-state { color: var(--mx-text-gray-600); font-size: 0.9rem; padding: 40px 0; text-align: center; }

  /* Base rule intentionally does NOT set "display" -- the browser's own
     "dialog:not([open]) { display: none; }" default has to stay in charge
     while a dialog is closed. Scoped to [open] so closed dialogs stay
     properly hidden (see git history for why this matters). */
  dialog.brief-modal[open] {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); margin: 0;
    width: min(720px, 92vw); max-height: 82vh; padding: 0; border: none; border-radius: 14px;
    background: var(--mx-card-bg); color: var(--mx-text-dark); display: flex; flex-direction: column;
  }
  dialog.brief-modal::backdrop { background: rgba(15, 15, 20, 0.55); }
  body:has(dialog.brief-modal[open]) { overflow: hidden; }
  .brief-modal-header {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    padding: 20px 24px; border-bottom: 1px solid var(--mx-border); flex-shrink: 0;
  }
  .brief-modal-title { font-size: 1.05rem; font-weight: 700; }
  .brief-modal-meta { color: var(--mx-text-gray-600); font-size: 0.85rem; margin-top: 4px; }
  .brief-modal-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .btn-icon-close {
    width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--mx-border); background: transparent;
    color: var(--mx-text-gray-600); cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-family: inherit; font-size: 1rem; line-height: 1;
  }
  .btn-icon-close:hover { background: var(--mx-body-bg); }
  .brief-modal-body { padding: 20px 24px 24px; overflow-y: auto; flex: 1 1 auto; min-height: 0; }

  dl.brief-field-table { display: grid; grid-template-columns: 190px 1fr; row-gap: 10px; column-gap: 16px; margin: 0 0 22px; font-size: 0.88rem; }
  dl.brief-field-table dt { color: var(--mx-text-gray-500); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; font-weight: 600; padding-top: 2px; }
  dl.brief-field-table dd { margin: 0; }

  .section-list { display: flex; flex-direction: column; gap: 10px; }
  .section-item { border: 1px solid var(--mx-border); border-radius: 8px; padding: 12px 16px; }
  .section-item-header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .section-heading { font-weight: 600; }
  .section-level { color: var(--mx-text-gray-500); font-size: 0.72rem; text-transform: uppercase; font-weight: 700; }
  .section-budget { color: var(--mx-primary); font-size: 0.82rem; font-weight: 600; margin-left: auto; }
  .section-points { font-size: 0.87rem; margin-top: 6px; }
  .section-keywords { color: var(--mx-text-gray-600); font-size: 0.8rem; margin-top: 6px; }

  .draft-article h2 { font-size: 1.1rem; margin: 28px 0 8px; }
  .draft-article h3 { font-size: 1.02rem; margin: 24px 0 6px; }
  .draft-article h4 { font-size: 0.94rem; margin: 20px 0 6px; }
  .draft-article p { font-size: 0.9rem; line-height: 1.6; margin: 0 0 12px; }
  .draft-article ul, .draft-article ol { font-size: 0.9rem; line-height: 1.6; margin: 0 0 12px; padding-left: 22px; }
  .draft-article li { margin-bottom: 4px; }
  .draft-article .content-note {
    background: var(--mx-primary-light); border-left: 3px solid var(--mx-primary); border-radius: 6px;
    padding: 10px 14px; font-size: 0.87rem; line-height: 1.5; margin: 0 0 12px;
  }

  .qa-score-hero { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .qa-score-value { font-size: 2.2rem; font-weight: 800; color: var(--score-color); }
  .qa-score-value span { font-size: 1.1rem; font-weight: 600; color: var(--mx-text-gray-500); }
  .qa-section-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; font-weight: 600; color: var(--mx-text-gray-500); margin: 20px 0 8px; }
  .qa-deductions-list, .qa-notes { font-size: 0.87rem; }
  .qa-deductions-list ul { margin: 0; padding-left: 18px; }
  .qa-deductions-list li { margin-bottom: 4px; }
  .qa-clean { color: #50cd89; font-weight: 600; font-size: 0.87rem; }
</style>
</head>
<body>
<div class="app">
  
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-logo-text">HMSPro</span>
      </div>
      <nav class="sidebar-nav">
        <a class="sidebar-link" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg><span>Dashboard</span></a>
        <a class="sidebar-link" href="history.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>History</span></a>
        <a class="sidebar-link" href="reporting.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5h16"/><path d="M7 16v-4"/><path d="M12 16V8"/><path d="M17 16v-6.5"/></svg><span>Reporting</span></a>
        <a class="sidebar-link active" href="content.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h9l3 3v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1z"/><path d="M8.5 10h7"/><path d="M8.5 13.5h7"/><path d="M8.5 17h4.5"/></svg><span>Content</span></a>
        <a class="sidebar-link" href="activity.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5 6L14 5l2 7h5"/></svg><span>Activity & Performance</span></a>
        <a class="sidebar-link" href="keyword-research.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15 20.5 20.5"/></svg><span>Keyword Research</span></a>
      </nav>
    </aside>
    
  <div class="main">
    
    <header class="topbar">
      <div>
        <div class="topbar-title">Content Outlines</div>
        <div class="topbar-sub">0 outline(s) created</div>
      </div>
      
    </header>
    
    <main class="content">
      <div class="empty-state">No content outlines yet -- run the /blog-outline skill to create one.</div>
    </main>
  </div>
</div>
<script>
document.querySelectorAll(".tab-button").forEach(function (button) {
  button.addEventListener("click", function () {
    document.querySelectorAll(".tab-button").forEach(function (b) { b.classList.remove("active"); });
    document.querySelectorAll(".tab-panel").forEach(function (p) { p.hidden = true; });
    button.classList.add("active");
    document.getElementById("tab-panel-" + button.dataset.tab).hidden = false;
  });
});
document.querySelectorAll(".brief-row").forEach(function (row) {
  row.addEventListener("click", function (event) {
    if (event.target.closest("[data-no-row-click]")) { return; }
    var modal = document.getElementById(row.getAttribute("data-modal-target"));
    if (modal) { modal.showModal(); }
  });
});
document.querySelectorAll(".brief-modal-close").forEach(function (button) {
  button.addEventListener("click", function () {
    button.closest("dialog").close();
  });
});
</script>
</body>
</html>
